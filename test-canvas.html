<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>KakiMoni テストモード</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
  body { background: #111; color: #eee; font-family: sans-serif; overflow: hidden;
         width: 100vw; height: 100vh; display: flex; flex-direction: column; }

  #topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    background: #1a1a2e; border-bottom: 2px solid #2d2d4a;
    flex-shrink: 0;
  }
  #mode-label { font-size: 0.85rem; color: #fbbf24; font-weight: bold;
                background: #3d2800; border: 1px solid #f59e0b;
                padding: 2px 10px; border-radius: 6px; }
  #seat-label { font-size: 1rem; color: #a78bfa; font-weight: bold; }

  #toolbar {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px;
    background: #16213e; border-bottom: 2px solid #2d2d4a;
    flex-shrink: 0; flex-wrap: wrap;
  }
  .color-btn {
    width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent;
    cursor: pointer; transition: transform 0.1s, border-color 0.1s; flex-shrink: 0;
  }
  .color-btn.active { border-color: #fff; transform: scale(1.2); }
  .tool-btn {
    padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
    font-size: 0.85rem; flex-shrink: 0;
  }
  #btn-eraser { background: #f97316; color: #fff; }
  #btn-clear  { background: #ef4444; color: #fff; }
  #btn-undo   { background: #6366f1; color: #fff; font-size: 1.1rem; }
  .tool-btn.active-tool { outline: 3px solid #fff; }

  #size-wrap { display: flex; align-items: center; gap: 6px; }
  #size-label { font-size: 0.8rem; color: #94a3b8; }
  #size-slider { width: 80px; accent-color: #a78bfa; }

  #canvas-wrap {
    flex: 1; position: relative; overflow: hidden; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #canvas-inner { position: absolute; background: #fff; overflow: hidden; }
  #main-canvas  { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>

<div id="topbar">
  <span id="mode-label">🧪 テストモード</span>
  <span id="seat-label">席 1</span>
  <span style="color:#64748b;font-size:0.8rem;">サーバー未接続</span>
</div>

<div id="toolbar">
  <button class="tool-btn" id="btn-clear">クリア</button>
  <button class="tool-btn" id="btn-undo">↶</button>
  <button class="tool-btn" id="btn-eraser">消しゴム</button>
  <div id="size-wrap">
    <span id="size-label">太さ</span>
    <input type="range" id="size-slider" min="2" max="40" value="8">
  </div>
</div>

<div id="canvas-wrap">
  <div id="canvas-inner">
    <canvas id="main-canvas"></canvas>
  </div>
</div>

<script>
// URLパラメータから席番号取得
const params = new URLSearchParams(location.search);
const seat = params.get('seat') || '1';
document.getElementById('seat-label').textContent = `席 ${seat}`;

// パレット（localStorage から読み込み）
const DEFAULT_PALETTE = ['#000000','#ef4444','#3b82f6','#22c55e'];
let palette = [];
try { palette = JSON.parse(localStorage.getItem('kakimoni_palette')) || DEFAULT_PALETTE; } catch { palette = DEFAULT_PALETTE; }
let penSize = parseInt(localStorage.getItem('kakimoni_pensize') || '8');

const toolbar = document.getElementById('toolbar');
const sizeSlider = document.getElementById('size-slider');
sizeSlider.value = penSize;

// パレットボタン生成
palette.forEach((color, i) => {
  const btn = document.createElement('div');
  btn.className = 'color-btn' + (i === 0 ? ' active' : '');
  btn.style.background = color;
  btn.dataset.color = color;
  btn.addEventListener('click', () => {
    toolbar.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    penColor = color;
    activeTool = 'pen';
    document.getElementById('btn-eraser').classList.remove('active-tool');
  });
  // size-wrapの前に挿入
  toolbar.insertBefore(btn, document.getElementById('size-wrap'));
});

let penColor = palette[0] || '#000000';
let activeTool = 'pen';
let isDrawing = false;
let currentStroke = null;
const strokeHistory = [];
const undoStack = [];

sizeSlider.addEventListener('input', () => { penSize = parseInt(sizeSlider.value); });

document.getElementById('btn-eraser').addEventListener('click', () => {
  activeTool = 'eraser';
  document.getElementById('btn-eraser').classList.add('active-tool');
});
document.getElementById('btn-clear').addEventListener('click', () => {
  undoStack.push([...strokeHistory]);
  strokeHistory.length = 0;
  redrawAll();
});
document.getElementById('btn-undo').addEventListener('click', () => {
  if (!undoStack.length) return;
  const prev = undoStack.pop();
  strokeHistory.length = 0;
  for (const s of prev) strokeHistory.push(s);
  redrawAll();
});

const canvas = document.getElementById('main-canvas');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');
const inner  = document.getElementById('canvas-inner');

function resizeCanvas() {
  const { width, height } = wrap.getBoundingClientRect();
  let iw, ih;
  if (width / height > 16 / 9) { ih = height; iw = ih * 16 / 9; }
  else { iw = width; ih = iw * 9 / 16; }
  inner.style.width  = iw + 'px';
  inner.style.height = ih + 'px';
  inner.style.left   = ((width - iw) / 2) + 'px';
  inner.style.top    = ((height - ih) / 2) + 'px';
  const ratio = window.devicePixelRatio || 1;
  canvas.width  = Math.floor(iw * ratio);
  canvas.height = Math.floor(ih * ratio);
  canvas.style.width  = iw + 'px';
  canvas.style.height = ih + 'px';
  ctx.scale(ratio, ratio);
  redrawAll();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function redrawAll() {
  const w = canvas.width / (window.devicePixelRatio || 1);
  const h = canvas.height / (window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);
  for (const stroke of strokeHistory) drawStroke(stroke);
}

function drawStroke(stroke) {
  if (!stroke.points || stroke.points.length < 2) return;
  ctx.save();
  ctx.strokeStyle = stroke.tool === 'eraser' ? '#ffffff' : stroke.color;
  ctx.lineWidth   = stroke.size;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  if (stroke.tool === 'eraser') ctx.globalCompositeOperation = 'destination-out';
  ctx.beginPath();
  ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
  for (let i = 1; i < stroke.points.length; i++) ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
  ctx.stroke();
  ctx.restore();
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  const scaleX = (canvas.width / ratio) / rect.width;
  const scaleY = (canvas.height / ratio) / rect.height;
  return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  isDrawing = true;
  undoStack.push([...strokeHistory]);
  currentStroke = { color: penColor, size: penSize, tool: activeTool, points: [getPos(e)] };
});
canvas.addEventListener('pointermove', e => {
  e.preventDefault();
  if (!isDrawing || !currentStroke) return;
  currentStroke.points.push(getPos(e));
  redrawAll();
  drawStroke(currentStroke);
});
canvas.addEventListener('pointerup', e => {
  e.preventDefault();
  if (!isDrawing || !currentStroke) return;
  isDrawing = false;
  strokeHistory.push(currentStroke);
  currentStroke = null;
  redrawAll();
});
canvas.addEventListener('pointercancel', e => {
  isDrawing = false; currentStroke = null;
});

document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
